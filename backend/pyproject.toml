[project]
name = "medminder"
version = "0.1.0"
description = "MedMinder — personal medication tracker API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "pydantic[email]>=2.9.0,<3.0",
    "pydantic-settings>=2.6.0,<3.0",
    "uvicorn[standard]>=0.32.0,<1.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "alembic>=1.14.0,<2.0",
    "psycopg[binary]>=3.2.0,<4.0",
    "asyncpg>=0.30.0,<1.0",
    "argon2-cffi>=25.1.0,<26.0",
    "typer>=0.15.0,<1.0",
    "itsdangerous>=2.2.0,<3.0",
    "apscheduler>=3.11,<4.0",
    "pywebpush>=2.0,<3.0",
    # Explicitly pinned (also a pywebpush transitive dep) — used to encrypt
    # push subscription keys at rest (ADR-0020); ships py.typed.
    "cryptography>=44,<49",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0,<1.0",
    "mypy>=2.0,<3.0",
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "pytest-cov>=7.0,<8.0",
    "httpx>=0.27.0,<1.0",
    "freezegun>=1.5.0,<2.0",
]

[project.scripts]
medminder-admin = "medminder.cli.main:app"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "RUF", # ruff-specific rules
]
ignore = [
    "S101", # assert used in tests
]

[tool.ruff.lint.per-file-ignores]
# Test passwords are obviously not real secrets.
"tests/**/*.py" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["medminder"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
# pytest-asyncio 1.x decouples fixture/test event-loop scope. The suite
# uses one session-scoped async engine (conftest) with per-test
# transaction rollback, so tests AND fixtures must share a single
# session loop — otherwise asyncpg raises "Future attached to a
# different loop".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "--cov=medminder --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["medminder"]
omit = [
    "src/medminder/cli/__main__.py",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
