openapi: 3.1.0
info:
  title: MedMinder — Adherence views (Phase 9)
  version: "0.1.0"
  description: >
    Read-only adherence endpoints. Both are scoped to the authenticated user's own
    medications and dose history (session cookie auth). No data is written; nothing new
    is persisted (adherence is derived). This contract is the design intent; the
    authoritative wire types are regenerated from the live FastAPI OpenAPI document into
    frontend/src/api/v1.d.ts via `just generate-client`.

    Note: the query params and response fields `from`/`to` keep these wire names, but
    because `from` is a Python keyword the implementation declares aliased Pydantic /
    FastAPI fields (e.g. `from_` with `alias="from"`, `populate_by_name=True`).

paths:
  /api/v1/adherence/medications/{medication_id}:
    get:
      operationId: getMedicationAdherence
      summary: Per-day adherence for one medication over a date range, plus % and course progress.
      tags: [adherence]
      parameters:
        - in: path
          name: medication_id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: from
          required: true
          description: First local day to include (inclusive), YYYY-MM-DD.
          schema: { type: string, format: date }
        - in: query
          name: to
          required: true
          description: Last local day to include (inclusive), YYYY-MM-DD. Must be >= from; the span (to - from) must be <= 366 days, else 422.
          schema: { type: string, format: date }
        - in: query
          name: timezone
          required: false
          description: Optional IANA zone override; defaults to the user's stored timezone.
          schema: { type: string }
      responses:
        "200":
          description: Per-day adherence for the window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MedicationAdherence" }
        "400":
          description: Unknown IANA timezone.
        "401":
          description: Not authenticated.
        "404":
          description: Medication not found or not owned by the caller.
        "422":
          description: Inverted range (to < from) or span wider than 366 days.

  /api/v1/adherence/export.csv:
    get:
      operationId: exportDoseHistoryCsv
      summary: CSV export of the caller's full non-voided dose history.
      tags: [adherence]
      parameters:
        - in: query
          name: timezone
          required: false
          description: Optional IANA zone override for taken_at formatting.
          schema: { type: string }
      responses:
        "200":
          description: >
            CSV attachment, one row per non-voided dose across all the caller's medications.
            Columns: medication_name, taken_at, quantity, unit, schedule_label, soft_deleted.
            Soft-deleted medications appear with the name suffixed " (removed)".
          headers:
            Content-Disposition:
              schema: { type: string }
              description: attachment; filename="medminder-doses.csv"
          content:
            text/csv:
              schema: { type: string }
        "401":
          description: Not authenticated.

components:
  schemas:
    DayStatus:
      type: string
      enum: [taken, partial, missed, future, inactive]

    DayAdherence:
      type: object
      additionalProperties: false
      required: [date, expected, taken, status]
      properties:
        date: { type: string, format: date }
        expected: { type: integer, minimum: 0 }
        taken: { type: integer, minimum: 0 }
        status: { $ref: "#/components/schemas/DayStatus" }

    CourseProgress:
      type: object
      additionalProperties: false
      required: [total, taken, complete]
      properties:
        total: { type: integer, minimum: 1 }
        taken: { type: integer, minimum: 0 }
        complete: { type: boolean }

    MedicationAdherence:
      type: object
      additionalProperties: false
      required: [medication_id, timezone, from, to, days, adherence_pct, course]
      properties:
        medication_id: { type: string, format: uuid }
        timezone: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        days:
          type: array
          items: { $ref: "#/components/schemas/DayAdherence" }
        adherence_pct:
          type: [number, "null"]
          minimum: 0
          maximum: 100
          description: >
            (taken ÷ expected) × 100 over the window, excluding inactive/future days,
            rounded to one decimal place. Null for PRN/unscheduled medications (no
            "missed" concept).
        course:
          oneOf:
            - { $ref: "#/components/schemas/CourseProgress" }
            - { type: "null" }
          description: Null when the medication has no course size (total_doses).
