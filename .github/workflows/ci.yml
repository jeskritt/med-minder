name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.8"

      - name: Install backend dependencies
        run: cd backend && uv sync --frozen --extra dev

      - name: Ruff check
        run: cd backend && uv run --frozen --no-sync ruff check src/ tests/

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pnpm
        run: npm install -g pnpm@10.33.2

      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: ESLint
        run: cd frontend && pnpm lint

      - name: Prettier
        run: cd frontend && pnpm format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.8"

      - name: Install backend dependencies
        run: cd backend && uv sync --frozen --extra dev

      - name: mypy --strict
        run: cd backend && uv run --frozen --no-sync mypy --strict src/

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pnpm
        run: npm install -g pnpm@10.33.2

      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: tsc --noEmit
        run: cd frontend && pnpm typecheck

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medminder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/medminder
      PYTHONTZPATH: ""
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.8"

      - name: Install Postgres client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: cd backend && uv sync --frozen --extra dev

      - name: Apply migrations
        run: cd backend && uv run --frozen --no-sync alembic upgrade head

      - name: Verify no autogen drift
        run: cd backend && uv run --frozen --no-sync alembic check

      - name: Run pytest
        run: cd backend && uv run --frozen --no-sync pytest tests/ -v

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pnpm
        run: npm install -g pnpm@10.33.2

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Run vitest
        run: cd frontend && pnpm test

  security-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.8"

      - name: Export locked backend dependencies
        run: >-
          cd backend && uv export --frozen --extra dev --no-emit-project
          --no-hashes --format requirements.txt -o /tmp/backend-requirements.txt

      # Audit the exact locked backend dependency graph without mixing in
      # pip-audit's own transitive dependencies.
      - name: pip-audit (backend)
        run: uvx pip-audit -r /tmp/backend-requirements.txt --no-deps --disable-pip

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pnpm
        run: npm install -g pnpm@10.33.2

      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: pnpm audit (frontend)
        run: cd frontend && pnpm audit --audit-level high

  openapi-drift:
    name: OpenAPI Client Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.8"

      - name: Install backend dependencies
        run: cd backend && uv sync --frozen --extra dev

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pnpm
        run: npm install -g pnpm@10.33.2

      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Regenerate OpenAPI client
        run: uv run --project backend --frozen --no-sync python scripts/generate_openapi_client.py

      - name: Check for drift
        run: |
          git diff --exit-code frontend/src/api/
          if [ $? -ne 0 ]; then
            echo "ERROR: OpenAPI client is out of sync with the backend."
            echo "Run 'just generate-client' and commit the changes."
            exit 1
          fi
